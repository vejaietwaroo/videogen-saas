<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoGen SaaS Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; max-width: 600px; margin: 40px auto; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 16px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0ea5e9; }
        pre { background: #0f172a; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <h2>VideoGen SaaS Client</h2>

    <!-- License Verification Section -->
    <div class="card">
        <h3>1. License Verification</h3>
        <label>Enter License Key:</label>
        <input type="text" id="licenseKey" value="LTD-VIP-2026">
        <button onclick="verifyLicense()">Verify & Get Token</button>
    </div>

    <!-- Secure Render Section -->
    <div class="card">
        <h3>2. Queue Video Render</h3>
        <label>Video Prompt / Settings:</label>
        <textarea id="renderPrompt">Morning meditation and yoga routine</textarea>
        <button onclick="triggerRender()">Queue Secure Render</button>
    </div>

    <!-- Status Output -->
    <div class="card">
        <h3>Console Output</h3>
        <pre id="output">System ready. Enter your key above.</pre>
    </div>

    <script>
        let authToken = "";

        async function verifyLicense() {
            const key = document.getElementById("licenseKey").value;
            const output = document.getElementById("output");
            
            try {
                const response = await fetch("http://127.0.0.1:8000/api/verify-license", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ license_key: key })
                });
                const data = await response.json();
                if (response.ok) {
                    authToken = data.access_token;
                    output.innerText = `[SUCCESS] License Verified!\nJWT Token acquired:\n${authToken}`;
                } else {
                    output.innerText = `[ERROR] ${data.detail || 'Verification failed'}`;
                }
            } catch (err) {
                output.innerText = `[NETWORK ERROR] Could not connect to backend server. Make sure Uvicorn is running.`;
            }
        }

        async function triggerRender() {
            const promptText = document.getElementById("renderPrompt").value;
            const output = document.getElementById("output");

            if (!authToken) {
                output.innerText = `[ERROR] Please verify your license key first to get an auth token!`;
                return;
            }

            try {
                const response = await fetch("https://videogen-saas.onrender.com/api/render", {, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await response.json();
                if (response.ok) {
                    output.innerText = `[SUCCESS] Render Job Queued!\nResponse:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    output.innerText = `[ERROR] ${data.detail || 'Render request failed'}`;
                }
            } catch (err) {
                output.innerText = `[NETWORK ERROR] Failed to reach render endpoint.`;
            }
        }
    </script>
</body>
</html>
