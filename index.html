<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoGen SaaS Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
    <div class="max-w-4xl mx-auto px-4 py-10">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">VideoGen Studio</h1>
                <p class="text-sm text-slate-400">Cinematic AI Video Generation Platform</p>
            </div>
            <div id="auth-status" class="text-xs px-3 py-1.5 rounded-full bg-red-950/80 text-red-300 border border-red-800">
                License Inactive
            </div>
        </header>

        <!-- License Activation Box -->
        <div id="license-section" class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-8 shadow-lg">
            <h2 class="text-lg font-semibold mb-2">Activate VIP License</h2>
            <p class="text-sm text-slate-400 mb-4">Enter your VIP lifetime license key to unlock generation capabilities.</p>
            <div class="flex gap-3">
                <input type="text" id="license-key-input" placeholder="e.g., LTD-VIP-2026" class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                <button onclick="activateLicense()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition-colors cursor-pointer">Activate</button>
            </div>
            <p id="license-msg" class="text-xs mt-2 text-red-400 hidden"></p>
        </div>

        <!-- Studio Generator Workspace (Hidden until activated) -->
        <div id="studio-workspace" class="space-y-6 opacity-40 pointer-events-none transition-opacity duration-300">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">Video Parameters</h2>
                    <span id="usage-badge" class="text-xs px-2.5 py-1 rounded bg-slate-800 text-slate-300">Usage: 0 / 50</span>
                </div>

                <!-- Prompt Input -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Visual Scene Description</label>
                    <textarea id="prompt-input" rows="3" placeholder="Describe your cinematic scene in detail..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <!-- Aspect Ratio -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5">Aspect Ratio</label>
                        <select id="aspect-ratio" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="9:16">9:16 (Vertical / Reels / TikTok)</option>
                            <option value="16:9">16:9 (Horizontal / YouTube)</option>
                            <option value="1:1">1:1 (Square)</option>
                        </select>
                    </div>

                    <!-- Avatar Preset -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5">Presenter Avatar</label>
                        <select id="avatar-select" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="none">None (Standard Cinematic Scene)</option>
                            <option value="wellness_coach">Wellness Guide / Tai Chi Instructor</option>
                            <option value="female_presenter">Female Presenter</option>
                            <option value="male_presenter">Male Presenter</option>
                            <option value="noir_detective">Thriller / Noir Character</option>
                        </select>
                    </div>
                </div>

                <!-- Generate Button -->
                <button id="generate-btn" onclick="generateVideo()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium py-3 rounded-lg text-sm shadow-md transition-all cursor-pointer flex justify-center items-center gap-2">
                    <span>Generate Cinematic Video</span>
                </button>
            </div>

            <!-- Output / Results Section -->
            <div id="output-section" class="bg-slate-900 border border-slate-800 rounded-xl p-6 hidden">
                <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Rendered Result</h3>
                <div id="result-container" class="flex flex-col items-center justify-center">
                    <!-- Video player or loading spinner injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem("videogen_token") || "";

        if (authToken) {
            lockUI(true);
        }

        async function activateLicense() {
            const licenseKey = document.getElementById("license-key-input").value.trim();
            const msgEl = document.getElementById("license-msg");
            
            if (!licenseKey) {
                msgEl.textContent = "Please enter a license key.";
                msgEl.classList.remove("hidden");
                return;
            }

            try {
                const res = await fetch("/api/verify-license", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ license_key: licenseKey })
                });
                const data = await res.json();

                if (res.ok && data.access_token) {
                    authToken = data.access_token;
                    localStorage.setItem("videogen_token", authToken);
                    lockUI(true);
                    msgEl.classList.add("hidden");
                } else {
                    msgEl.textContent = data.detail || "Invalid license key.";
                    msgEl.classList.remove("hidden");
                }
            } catch (err) {
                msgEl.textContent = "Connection error verifying license.";
                msgEl.classList.remove("hidden");
            }
        }

        function lockUI(active) {
            const statusEl = document.getElementById("auth-status");
            const workspace = document.getElementById("studio-workspace");
            const licenseSec = document.getElementById("license-section");

            if (active) {
                statusEl.textContent = "VIP License Active";
                statusEl.className = "text-xs px-3 py-1.5 rounded-full bg-emerald-950/80 text-emerald-300 border border-emerald-800";
                workspace.style.opacity = "1";
                workspace.style.pointerEvents = "auto";
                licenseSec.style.display = "none";
            }
        }

        async function generateVideo() {
            const prompt = document.getElementById("prompt-input").value.trim();
            const aspect_ratio = document.getElementById("aspect-ratio").value;
            const avatar = document.getElementById("avatar-select").value;
            const btn = document.getElementById("generate-btn");
            const outputSec = document.getElementById("output-section");
            const resultContainer = document.getElementById("result-container");

            if (!prompt) {
                alert("Please enter a visual scene description.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Rendering Video (~30s)...`;
            
            outputSec.classList.remove("hidden");
            resultContainer.innerHTML = `<div class="py-12 flex flex-col items-center text-slate-400 gap-3"><svg class="animate-spin h-8 w-8 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="text-sm">Synthesizing cinematic visuals via Fal.ai...</p></div>`;

            try {
                const res = await fetch("/api/render", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ prompt, aspect_ratio, avatar })
                });

                const data = await res.json();

                if (res.ok && data.video_url) {
                    document.getElementById("usage-badge").textContent = `Usage: ${data.videos_rendered} / ${data.limit}`;
                    resultContainer.innerHTML = `
                        <video controls autoplay loop class="w-full rounded-lg shadow-xl max-h-[500px] object-cover mb-4">
                            <source src="${data.video_url}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        <a href="${data.video_url}" target="_blank" download class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-4 py-2 rounded-lg transition-colors">Download Video File</a>
                    `;
                } else {
                    resultContainer.innerHTML = `<p class="text-red-400 text-sm py-6">Error: ${data.detail || "Rendering failed."}</p>`;
                }
            } catch (err) {
                resultContainer.innerHTML = `<p class="text-red-400 text-sm py-6">Network error during render process.</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Generate Cinematic Video</span>`;
            }
        }
    </script>
</body>
</html>
